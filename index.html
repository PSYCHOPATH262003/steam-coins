<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Coins & Showcase Store</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #238636;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: #fff; }
        .nav-links a {
            color: var(--accent-color);
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }
        .nav-links a:hover { text-decoration: underline; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .price {
            color: #3fb950;
            font-size: 18px;
            font-weight: bold;
        }
        button {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        
        /* არტვორკის ფოტოების დაცვა გადმოწერისგან და გადათრევისგან */
        .artwork-img {
            max-width: 100%;
            border-radius: 4px;
            -webkit-user-drag: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Steam Coins & Artworks</h1>
            <div class="nav-links">
                <a href="index.html">მთავარი</a>
                <a href="vip.html">VIP ლოჟა</a>
            </div>
        </header>

        <div class="card">
            <h2>მოგესალმებით Steam Store-ში!</h2>
            <p>აქ შეგიძლია შეიძინო საუკეთესო არტვორკები და ქოინები შენი პროფილის გასაფორმებლად.</p>
        </div>

        <div class="card">
            <h2>არტვორკის ვიტრინა</h2>
            <p>დიზაინი #1</p>
            <p class="price">ფასი: 500 ქოინი</p>
            <!-- დაცული სურათი -->
            <img src="https://placehold.co/600x200/1f242c/FFF.png?text=Steam+Artwork+Showcase" alt="Artwork" class="artwork-img">
            <br><br>
            <button>შეძენა</button>
        </div>
    </div>

    <script>
        // სრულად ბლოკავს მარჯვენა კლიკს და დრაგ-დროპს სურათებზე
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('contextmenu', e => e.preventDefault());
            img.addEventListener('dragstart', e => e.preventDefault());
        });
    </script>
</body>
</html>
