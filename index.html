<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Coins</title>
    <style>
        /* არტვორკის ფოტოების დაცვა გადმოწერისა და გადათრევისგან */
        img {
            -webkit-user-drag: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- შენი საიტის ძველი შიგთავსი -->
    <h1>Steam Coins Store</h1>
    <a href="vip.html">VIP ლოჟა</a>
    
    <div class="showcase">
        <!-- შენი სურათები ჩასვი აქ -->
        <img src="your-artwork.jpg" alt="Artwork">
    </div>

    <script>
        // სრულად ბლოკავს მარჯვენა კლიკს და დრაგ-დროპს სურათებზე
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('contextmenu', e => e.preventDefault());
            img.addEventListener('dragstart', e => e.preventDefault());
        });
    </script>
</body>
</html>
